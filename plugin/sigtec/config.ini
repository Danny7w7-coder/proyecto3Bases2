; Configuración del plugin SIG-TEC
; Datos para llegar al nodo central. El rol sigtec_login SOLO puede ejecutar autenticar().
; Los datos del nodo de cada campus NO van aquí: los entrega el central al autenticar.

[central]
host = localhost
puerto = 5440
base = sigtec
usuario = sigtec_login
clave = sigtec_login

[sistema]
; SRID institucional (CRTM05)
srid = 5367
